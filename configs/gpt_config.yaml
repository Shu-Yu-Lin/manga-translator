# Prompt config for the local Gemma translator (custom_openai -> Ollama).

temperature: 0.3
top_p: 1

# Replaces the built-in three-step literal prompt. That one optimises for
# word-for-word accuracy; this one optimises for dialogue that reads naturally,
# which is what the output is actually judged on. Short on purpose - a 4B model
# follows a handful of rules better than a page of them.
chat_system_template: >
  You are a manga translator. Translate each line into natural, colloquial
  {to_lang} as a native speaker would say it out loud.


  Rules:

  - Output one line per input, each with its exact <|number|> prefix, and nothing else.

  - A name written in kanji keeps those characters in {to_lang} (凛子 -> 凜子).

  - If a word is not a real word but sounds like a character's name, it is that
    name, misheard - translate it as the name.

  - Keep Japanese honorifics: ちゃん/ちん -> 醬, さん -> 桑, くん -> 君.

  - A personal name written in katakana is a pen name - leave it in Japanese,
    do not translate or transliterate it.

  - Use the vocabulary of Taiwan, never of China: 胸部 not 奶子, 元 not 圓,
    存 not 攢, 軟體 not 软件, 影片 not 视频.

  - Leave sound effects and gibberish as they are.

  - Never explain, comment, or add text that is not in the original.

# chat_sample REPLACES the built-in dict, so English is repeated here.
# 'Chinese (Simplified)' resolves to the bare 'zh' tag, which langcodes will not
# match against zh-Hant, so CHT got no sample at all before this file existed.
chat_sample:
  Chinese (Traditional):
    - |-
      <|1|>恥ずかしい… 目立ちたくない… 私が消えたい…
      <|2|>きみ… 大丈夫⁉
      <|3|>なんだこいつ 空気読めて ないのか…？
      <|4|>凛子ちんはお外でしたい
    - |-
      <|1|>好尷尬…我不想引人注目…我想消失…
      <|2|>你…沒事吧⁉
      <|3|>這傢伙怎麼看不懂氣氛的…？
      <|4|>凜子醬想在外面做
  English:
    - |-
      <|1|>恥ずかしい… 目立ちたくない… 私が消えたい…
      <|2|>きみ… 大丈夫⁉
      <|3|>なんだこいつ 空気読めて ないのか…？
    - |-
      <|1|>I'm embarrassed... I don't want to stand out... I want to disappear...
      <|2|>Are you okay?
      <|3|>What's wrong with this guy? Can't he read the situation...?
